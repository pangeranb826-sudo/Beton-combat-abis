function csv(t){const r=[];let row=[],c='',q=0;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);c='';if(row.some(x=>x.trim()))r.push(row);row=[]}else c+=ch}row.push(c);if(row.some(x=>x.trim()))r.push(row);return r}

 rows.slice(1).forEach(r=>{const name=g(r,'n'),dv=DIVS.find(d=>d.toLowerCase()==g(r,'dv').toLowerCase());if(!name||!dv){skip++;return}
  let f=S.f.find(o=>o.name.toLowerCase()==name.toLowerCase());if(f)upd++;else{f={id:uid(),active:true,champ:false,def:0};S.f.push(f);add++}
